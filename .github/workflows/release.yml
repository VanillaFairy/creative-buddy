name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: npm

      # Obsidian resolves a release by the tag equal to manifest.json's version.
      - name: Tag matches manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$TAG" ]; then
            echo "Tag $TAG does not match manifest.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --draft \
            main.js manifest.json styles.css
